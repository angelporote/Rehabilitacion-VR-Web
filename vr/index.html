<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RehabilitaciónVR · Lobby</title>
<meta name="description" content="El Lobby de RehabilitaciónVR en 3D: elige un juego en la pantalla o muévete libremente por la habitación.">
<!--
  EL LOBBY (lo que se ve al entrar en las gafas)
  - js/lobby/main.js      → modos "pantalla" y "libre", indicador y ficha de cada juego
  - js/lobby/sala.js      → la habitación y sus obstáculos (colisiones)
  - js/lobby/pantalla.js  → el monitor "Elige un juego" (sale de datos/vr.json)
  - js/lobby/jugador.js   → caminar en primera persona con colisiones
  - info.html             → la misma información en texto, sin 3D
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/lobby.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="../js/lobby/main.js"></script>
</head>
<body class="lobby" data-modo="pantalla">

<canvas id="scene" aria-label="El Lobby en 3D: una habitación con una mesa y la pantalla para elegir un juego"></canvas>
<div class="loader" id="loader">Entrando en el Lobby…</div>

<div class="lobby-ui">
  <a class="ghost salir" href="../">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 8H3M7 4L3 8l4 4"/></svg>
    Quitarse las gafas
  </a>

  <!-- Botón para "convertir la web en un videojuego" -->
  <button class="libre" id="libre">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="5" r="2.2"/><path d="M12 8v6l-3 6M12 14l3 6M8 11h8"/></svg>
    Muévete libremente por la lobby
  </button>
  <p class="solo-raton">Para moverte libremente necesitas teclado y ratón.</p>

  <button class="ghost volver" id="volver"><kbd>R</kbd> Volver a la pantalla</button>

  <!-- Indicador: modo, controles y plano de la habitación -->
  <aside class="indicador" aria-live="polite">
    <b id="indModo">Modo pantalla</b>
    <ul id="indAyuda"></ul>
    <canvas id="plano" width="150" height="170" aria-hidden="true"></canvas>
  </aside>

  <a class="texto" href="info.html">Ver la información en texto</a>
</div>

<!-- Mano VR en el centro de la vista cuando el ratón está capturado -->
<img class="mano" id="mano" src="../img/cursor/dedo.svg" alt="" aria-hidden="true">
<div class="pausa">Haz clic para seguir moviéndote · <kbd>R</kbd> para volver a la pantalla</div>

<!-- Ficha de un juego (provisional) -->
<aside class="ficha" id="ficha" aria-live="polite">
  <button class="cerrar" id="fichaCerrar" aria-label="Cerrar ficha">
    <svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.8"><path d="M1 1l10 10M11 1L1 11"/></svg>
  </button>
  <div id="fichaCuerpo"></div>
</aside>

</body>
</html>
